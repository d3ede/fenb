; Shift + Enter opens the in-game panel. Escape closes it.
; Panel edits apply live and save automatically. Named profiles use FENB-presets/*.ini.
[General]
enabled=1
open_on_start=0
panel_page=0
; Opt-in: remove the verified Homesickness client's built-in ~62.5 FPS cap.
; Other client revisions are left unchanged. Driver/VSync limits still apply.
unlock_fps=0

[Bloom]
