; Shift + Enter opens the in-game panel. Escape closes it.
; Panel edits apply live and save automatically. Named profiles use FENB-presets/*.ini.
[General]
enabled=1
open_on_start=0
panel_page=0
; Interface language: en (English, default) or ru (Russian).
language=en
; Opt-in render unlock; simulation retains the original 16 ms update cadence.
; Only the verified Homesickness revision is supported. Driver/VSync limits still apply.
unlock_fps=0
; Supported Homesickness client only; upgrades auto D16 to D24 while retaining MSAA. Restart required.
precise_water_depth=1

[Interface]
custom_cursor=1
interface_motion=1

; Local visual overrides for the verified Homesickness Neuz revision. Off follows the game.
[Environment]
time_override=0
; Minutes since midnight: 0..1439. 720 = 12:00.
time_minutes=720
freeze_time=1
weather_override=0
; 0 clear, 1 rain, 2 snow. Intensity is a percentage of the native particle count.
weather_type=0
weather_intensity=100

[Bloom]
bloom=1
bloom_strength=0.18
threshold=0.74
knee=0.18
radius=2
; 4 = economical, 2 = detailed. Factor along each image dimension.
bloom_scale=2

[Color]
color=1
exposure=0.06
contrast=1.025
saturation=1.025
temperature=0.015
tint=0
gamma=1.02
shadows=0
highlights=-0.04

[WaterFX]
water=1
water_waves=0.050000
water_length=9.500000
water_speed=0.400000
water_ripples=0.800000
water_ripple_scale=0.700000
water_opacity=0.740000
water_sky=0.740000
water_glints=1.100000
water_gloss=0.860000
water_tint=0.200000
; Scene-color copy is released when refraction, depth, SSR and caustics are all zero.
water_refraction=0.680000
; Keep the original repeating water texture subtle.
water_texture=0.000000
; Depth optics currently require the optional NVIDIA driver copy path. Unsupported GPUs retain the fallback.
water_depth=2.000000
water_shore=2.350000
water_ssr=1.000000
; 0 = 12 trace steps, 1 = 24 trace steps.
water_ssr_quality=1
; Optional underwater focusing. Requires readable depth and an enabled directional light.
water_caustics=0.000000
water_dispersion=0.150000
; 4 = quarter dimensions, 2 = half dimensions.
water_caustic_scale=2

; Independent scene effects. Depth features require the optional readable-depth backend.
[SceneFX]
; 0 keeps the native MSAA choice; -1 disables, 2/4/8 request samples. Changes use host device recovery.
msaa_samples=0
ssao=1
ao_strength=0.65
ao_radius=1.3
ao_bias=0.045
ao_distance=140
sun_rays=1
ray_strength=0.7
ray_length=1.05
ray_decay=0.975
sky=1
sky_strength=0.62
sky_horizon=0.65
cloud_contrast=1.08
sun_halo=0.65
sky_detail=0.7
sky_stars=0.55
fog=1
fog_density=0.0028
fog_start=42
fog_height=100
fog_falloff=0.012
fog_r=0.56
fog_g=0.66
fog_b=0.76
dof=1
focus_distance=45
focus_range=40
dof_radius=2.5
dof_near=0
adaptation=1
adaptation_key=0.11
adaptation_min_ev=-0.6
adaptation_max_ev=0.55
adapt_bright=1.8
adapt_dark=0.65
local_lighting=1
local_strength=2
local_range=1.55
scene_high_quality=0
fxaa=0
smaa=1
fxaa_strength=0.8
fxaa_threshold=0.09
night_foliage=0.75

lighting_balance=1

lighting_balance_strength=0.6

; Material-local enhancements for recognized world skill particles. HUD and animation stay native.
sfx=0
sfx_intensity=1.2
sfx_glow=0.35
sfx_saturation=1.12
sfx_softness=0.35
; Refractive water footsteps use one optional world-color snapshot, without reading the HUD.
sfx_wake=0.7
