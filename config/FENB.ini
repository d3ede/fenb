; Shift + Enter opens the in-game panel. Escape closes it.
; Panel edits apply live and save automatically. Named profiles use FENB-presets/*.ini.
[General]
enabled=1
open_on_start=0
panel_page=0
; Opt-in render unlock; simulation retains the original 16 ms update cadence.
; Only the verified Homesickness revision is supported. Driver/VSync limits still apply.
unlock_fps=0
; Supported Homesickness client only; upgrades auto D16 to D24 while retaining MSAA. Restart required.
precise_water_depth=1

[Bloom]
bloom=1
bloom_strength=0.22
threshold=0.72
knee=0.15
radius=1.6
; 4 = economical, 2 = detailed. Factor along each image dimension.
bloom_scale=4

[Color]
color=1
exposure=0
contrast=1
saturation=1
temperature=0
tint=0
gamma=1
shadows=0
highlights=0

[WaterFX]
water=1
water_waves=0.035
water_length=5
water_speed=0.7
water_ripples=0.35
water_ripple_scale=2
water_opacity=0.55
water_sky=0.25
water_glints=0.65
water_gloss=0.65
water_tint=0.25
; Scene-color copy is released when refraction, depth, SSR and caustics are all zero.
water_refraction=0.35
; Keep the original repeating water texture subtle.
water_texture=0.05
; Depth optics currently require the optional NVIDIA driver copy path. Unsupported GPUs retain the fallback.
water_depth=1
water_shore=0.6
water_ssr=0.65
; 0 = 12 trace steps, 1 = 24 trace steps.
water_ssr_quality=0
; Optional underwater focusing. Requires readable depth and an enabled directional light.
water_caustics=0
water_dispersion=0.15
; 4 = quarter dimensions, 2 = half dimensions.
water_caustic_scale=4

; Independent scene effects. Depth features require the optional readable-depth backend.
[SceneFX]
; 0 keeps the native MSAA choice; -1 disables, 2/4/8 request samples. Restart required.
msaa_samples=0
ssao=0
ao_strength=.65
ao_radius=1.
ao_bias=.04
ao_distance=150.
sun_rays=0
ray_strength=.25
ray_length=.85
ray_decay=.94
sky=0
sky_strength=.45
sky_horizon=.5
cloud_contrast=1.1
sun_halo=.3
fog=0
fog_density=.003
fog_start=25.
fog_height=0.
fog_falloff=.025
fog_r=.52
fog_g=.62
fog_b=.72
dof=0
focus_distance=30.
focus_range=20.
dof_radius=5.
dof_near=.25
adaptation=0
adaptation_key=.18
adaptation_min_ev=-1.
adaptation_max_ev=1.
adapt_bright=1.5
adapt_dark=.8
local_lighting=0
local_strength=1.
local_range=1.
scene_high_quality=0
fxaa=0
fxaa_strength=.75
fxaa_threshold=.125
night_foliage=.35
