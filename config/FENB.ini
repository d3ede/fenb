threshold=0.72
knee=0.15
radius=1.6
; 4 = economical, 2 = detailed. Factor along each image dimension.
bloom_scale=4

[Color]
color=1
exposure=0
contrast=1
saturation=1
temperature=0
tint=0
gamma=1
shadows=0
highlights=0

[WaterFX]
